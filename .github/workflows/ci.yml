name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Projects target net8.0. SDK 9 or newer is required to open ProdFalcon.slnx.
          # The 8.0 SDK supplies the targeting pack used by the projects.
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore ProdFalcon.slnx

      - name: Build
        run: dotnet build ProdFalcon.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ProdFalcon.Tests/ProdFalcon.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
